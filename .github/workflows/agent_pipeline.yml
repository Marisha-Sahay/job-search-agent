name: Job Search Agent Pipeline

on:
  schedule:
    # Run twice a day on workdays (Mon-Fri) at off-peak minutes:
    # - 10:45 UTC: 6:45 AM ET / 5:45 AM CT / 3:45 AM PT (Morning Fresh before work begins)
    # - 21:45 UTC: 5:45 PM ET / 4:45 PM CT / 2:45 PM PT (Afternoon Intake after recruiter syncs)
    - cron: '45 10,21 * * 1-5'
  workflow_dispatch: # Allow manual trigger anytime via GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python main.py

      - name: Commit seen jobs back to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          # Only commit if there are changes
          git commit -m "chore: update jobs.json with latest scrape [skip ci]" || echo "No changes to commit"
          git push

      - name: Prepare Web Deployment
        run: |
          # Copy the latest jobs.json into the web folder for deployment
          if [ -f "data/jobs.json" ]; then
            cp data/jobs.json web/jobs.json
          else
            echo "[]" > web/jobs.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
